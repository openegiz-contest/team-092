
services:
  smartmine-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    restart: unless-stopped
    networks:
      - openegiz

  smartmine-map:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-u", "map_server.py"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - openegiz

networks:
  openegiz:
    external: true
    name: openegiz_default

